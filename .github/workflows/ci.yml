name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      # build first: workspace packages resolve via dist/, so lint/typecheck
      # see unresolvable types for @telemetry-desk/* until it exists
      - run: npm run build
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  package-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:win -w @telemetry-desk/desktop
      - run: npm run verify:win-artifact -w @telemetry-desk/desktop
      - run: npm run e2e:win-unpacked -w @telemetry-desk/desktop
