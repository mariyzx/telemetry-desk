appId: com.telemetrydesk.app
productName: TelemetryDesk
directories:
  output: ../../release
files:
  - dist/**/*
  - assets/**/*
  - ../dashboard/dist/**/*
asarUnpack:
  - node_modules/@telemetry-desk/collector/**/*
  - node_modules/@telemetry-desk/{application,domain,infrastructure,platform,shared}/**/*
  - node_modules/drizzle-orm/**/*
  - node_modules/zod/**/*
win:
  target:
    - target: nsis
      arch: [x64]
artifactName: TelemetryDesk-${version}-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
