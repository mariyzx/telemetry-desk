appId: com.telemetrydesk.app
productName: TelemetryDesk
directories:
  output: ../../release
files:
  - dist/**/*
  - assets/**/*
  - ../dashboard/dist/**/*
win:
  target:
    - target: nsis
      arch: [x64]
artifactName: TelemetryDesk-${version}-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
